<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>webtunnel sample extension</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      p {
        margin: 0;
        font-size: 13px;
        line-height: 1.6;
      }
      code {
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <h1>拡張が読み込まれています</h1>
    <p>
      webtunnel の <code>extension_path</code> で読み込んだサンプル拡張の popup です。<br />
      この画面が描画されていれば、Chromium が unpacked 拡張を読み込めています。
    </p>
  </body>
</html>

      - *wait-encrypted-auth-key
      - *download-encrypted-auth-key
      - *wait-encrypted-auth-key
      - *download-encrypted-auth-key
      - *wait-encrypted-auth-key
      - *download-encrypted-auth-key
      - *wait-encrypted-auth-key
      - *download-encrypted-auth-key
      - *wait-encrypted-auth-key
      - *download-encrypted-auth-key
      - *wait-encrypted-auth-key
      - *download-encrypted-auth-key
      - *wait-encrypted-auth-key
      - *download-encrypted-auth-key
      - *wait-encrypted-auth-key
      - *download-encrypted-auth-key

      - name: auth key を復号
        id: tailscale-auth-key
        env:
          SESSION_PRIVATE_KEY_FILE: ${{ runner.temp }}/webtunnel-session-private-key.pem
          ENCRYPTED_AUTH_KEY_FILE: .webtunnel-runner/handoff/encrypted-auth-key.bin
        run: ./.webtunnel-runner/runner/decrypt-tailscale-auth-key.sh

      # ここまで（CDP がローカルで応答するまで）tailnet に参加しない。
      # 参照: PROJECT.md「リポジトリ公開に耐える安全性」
      # oauth-client-id / audience を渡すと action がこの job で OIDC トークンを発行しようとするため渡さない。
      # タグ（tag:ci）・ephemeral は auth key 側に付いている
      - name: Tailscale に参加
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ steps.tailscale-auth-key.outputs.auth_key }}
          hostname: ${{ env.TS_HOSTNAME }}

      - name: tailnet へブリッジ
        timeout-minutes: 10
        env:
          PREVIEW: ${{ inputs.preview }}
        run: |
          PORTS=("$CDP_PORT")
          if [ "$PREVIEW" = "true" ]; then PORTS+=("$PREVIEW_PORT"); fi
          ./.webtunnel-runner/runner/bridge.sh "${PORTS[@]}"

      - name: セッション情報を出力
        env:
          SESSION: ${{ inputs.session }}
          PREVIEW: ${{ inputs.preview }}
          SOFTWARE_WEBGL: ${{ inputs.software_webgl }}
        # tailnet の実 IP は出力しない。public リポジトリでは run のログ・サマリを誰でも読めるため
        # （参照: PROJECT.md「リポジトリ公開に耐える安全性」）。接続先の IP はローカルの
        # `webtunnel cdp <session>` が tailscale status から引く
        run: |
          {
            echo "## WebTunnel session ready"
            echo ""
            echo "- hostname: \`${TS_HOSTNAME}\`"
            echo "- CDP の接続先: \`webtunnel cdp ${SESSION}\`（Host ヘッダ制約のため MagicDNS 名ではなく tailscale IP で接続する。PROJECT.md「CDP の Host ヘッダ制約」参照）"
            echo "- スクリーンショット: \`webtunnel screenshot ${SESSION}\`"
            echo "- Chromium が開いた URL: \`${START_URL}\`"
            if [ -n "${WEBTUNNEL_EXTENSION_ID:-}" ]; then
              echo "- 読み込んだ拡張: \`chrome-extension://${WEBTUNNEL_EXTENSION_ID}/\`（popup は \`popup.html\` 等の manifest 記載のパス）"
            fi
            if [ "$SOFTWARE_WEBGL" = "true" ]; then
              echo "- ソフトウェア WebGL（SwiftShader）: 有効"
            fi
            if [ "$PREVIEW" = "true" ]; then
              echo "- preview: \`webtunnel preview ${SESSION}\`"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # 公開鍵を渡す前に失敗した時は、tailscale-auth-key job の待ち（最長 10 分）を打ち切らせる印を同じ名前の artifact で渡す
      - name: tailscale-auth-key job の待ちを打ち切らせる印を作る
        if: failure() && steps.upload-session-public-key.outcome != 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/webtunnel-handoff-abort"
          echo "session job が公開鍵を渡す前に失敗した" > "$RUNNER_TEMP/webtunnel-handoff-abort/session-aborted"
      - name: tailscale-auth-key job の待ちを打ち切らせる
        if: failure() && steps.upload-session-public-key.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webtunnel-session-public-key-${{ inputs.session }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/webtunnel-handoff-abort/session-aborted
          retention-days: 1

      - name: セッションを維持
        env:
          DURATION: ${{ inputs.duration_minutes }}
        run: ./.webtunnel-runner/runner/keepalive.sh "$DURATION" "$CDP_PORT"

      # down（gh run cancel）でも録画を artifact に残すため always() にする。
      # cancel 後も always() の step は猶予時間内で実行される
      - name: 録画を停止
        if: always() && inputs.record == 'true'
        timeout-minutes: 5
        run: ./.webtunnel-runner/runner/stop-recording.sh

      - name: 録画を artifact にアップロード
        if: always() && inputs.record == 'true'
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recording-${{ inputs.session }}
          path: ${{ runner.temp }}/webtunnel-recording.mp4
          if-no-files-found: warn
          retention-days: 7

      # dev サーバの起動失敗も、起動後のランタイムエラーも同じログで追えるようにする。
      # ただし認証情報を渡したセッションではアップロードしない。dev サーバがリクエスト内容や
      # 認証診断をログへ書くと復号済みの資格情報がファイルに残りうるが、add-mask は Actions ログの
      # 表示にしか効かず artifact のファイル内容は伏字にならない。ログが要るデバッグは
      # secret を外した構成で再現する
      - name: dev サーバのログを artifact にアップロード
        if: always() && (inputs.start_command != '' || inputs.setup_command != '') && env.WEBTUNNEL_HAS_AUTH_ENV != 'true'
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-server-log-${{ inputs.session }}
          path: ${{ runner.temp }}/webtunnel-dev-server*.log
          if-no-files-found: warn
          retention-days: 7

# Chromium + CDP セッションを張る reusable workflow。
# 他リポジトリからの呼び方（caller workflow の例）は PROJECT.md「各アプリ repo での実行」参照。
# webtunnel 自身は browser-session.yml（workflow_dispatch ラッパー）経由で呼ぶ。
name: session

on:
  workflow_call:
    inputs:
      session:
        description: "セッション名。tailnet ホスト名 webtunnel-<session>-<run id> になる（小文字英数字とハイフンのみ）"
        type: string
        required: true
      duration_minutes:
        description: "セッション維持時間（分）"
        type: string
        required: false
        default: "60"
      start_url:
        description: "Chromium 起動時に開く URL。空なら dev サーバの URL（起動しない場合は about:blank）"
        type: string
        required: false
        default: ""
      setup_command:
        description: "working_directory で実行するセットアップコマンド（例: npm ci、拡張のビルド）。dev サーバを起動しない（start_command が空の）セッションでも実行する。空ならスキップ"
        type: string
        required: false
        default: ""
      start_command:
        description: "dev サーバを起動するコマンド（例: npm run dev）。フォアグラウンドで動き続けるプロセスにする（デーモン化するとプロセス監視が起動失敗と誤認する）。空なら dev サーバを起動しない"
        type: string
        required: false
        default: ""
      working_directory:
        description: "setup_command / start_command を実行する caller リポジトリルート相対のディレクトリ"
        type: string
        required: false
        default: "."
      port:
        description: "dev サーバが listen するポート。PORT 環境変数として両コマンドに渡り、ready 判定にも使う"
        type: string
        required: false
        default: "5173"
      ready_path:
        description: "dev サーバの ready 判定に使うパス"
        type: string
        required: false
        default: "/"
      node_version:
        description: "actions/setup-node で用意する Node のバージョン。空なら runner のプリインストール版を使う"
        type: string
        required: false
        default: ""
      extension_path:
        description: "Chromium に読み込むパッケージ化されていない Chrome 拡張の、caller リポジトリルート相対のディレクトリ（manifest.json のある場所）。空なら読み込まない。ビルドが要る拡張は setup_command でビルドしておく"
        type: string
        required: false
        default: ""
      software_webgl:
        description: "ソフトウェア WebGL（SwiftShader）を有効にして Chromium を起動する。WebGL2 が要るページ（Godot の Web エクスポート等）を開く時だけ true にする。付くフラグは固定（PROJECT.md「ソフトウェア WebGL（SwiftShader）」参照）"
        type: string
        required: false
        default: "false"
      record:
        description: "セッション画面を録画して artifact に残す"
        type: string
        required: false
        default: "true"
      setup_script:
        description: "ログイン等のセットアップスクリプト（caller repo 基準のパス。存在しなければスキップ）"
        type: string
        required: false
        default: ".webtunnel/setup.sh"
      preview:
        description: "セッション画面をリアルタイムに見る preview（MJPEG）を tailnet に公開する"
        type: string
        required: false
        default: "true"
    secrets:
      TS_OIDC_CLIENT_ID:
        required: true
      TS_OIDC_AUDIENCE:
        required: true
      WEBTUNNEL_AUTH_ENV:
        description: "setup_script へ渡す KEY=VALUE 列を base64 で単一行にしたもの（PROJECT.md「ログイン済み状態でのセッション開始」参照）"
        required: false

env:
  # CDP の待ち受けポート。local/webtunnel CLI・bridge・keepalive すべてこの値を前提にする
  CDP_PORT: "9222"
  # preview（MJPEG）の待ち受けポート。local/webtunnel preview もこの値を前提にする
  PREVIEW_PORT: "9100"
  # secrets コンテキストは step の if で直接参照できないため、有無だけを env に写して判定に使う
  WEBTUNNEL_HAS_AUTH_ENV: ${{ secrets.WEBTUNNEL_AUTH_ENV != '' }}

# 同名セッションの同時起動を防ぐ（同じセッション名に run が 2 つあると、CLI がどちらに接続するか定まらない）。
# auth key の発行 job も待たせるため workflow 単位に置く。session job だけに置くと、後続の run が
# 先に発行した auth key が前の run の終了待ちの間に失効する。
# グループは caller リポジトリ単位のため、repo を跨いだ同名セッションは防げない
# （参照: PROJECT.md「未検証事項・リスク」）
concurrency:
  group: browser-session-${{ inputs.session }}
  cancel-in-progress: false

jobs:
  # OIDC トークンを発行できるのはこの job だけにし、caller のコード（setup_command / start_command /
  # setup_script）を一切実行しない。caller のコードが動く session job には id-token を渡さない
  # （参照: PROJECT.md「リポジトリ公開に耐える安全性」の 11）
  # session job とは並行に動き、session job が artifact で出す run ごとの公開鍵を待って、
  # それで暗号化した auth key を artifact で返す。job output・cache は使わない
  # （参照: PROJECT.md「リポジトリ公開に耐える安全性」の 11）
  tailscale-auth-key:
    runs-on: ubuntu-latest
    # 公開鍵の待ち（最長 10 分）と発行の分
    timeout-minutes: 20
    permissions:
      id-token: write
    steps:
      # re-run（2 回目以降の試行）では auth key を発行しない。artifact の名前空間は同じ run の試行で共有され、
      # 前の試行の caller のコードが ACTIONS_RUNTIME_TOKEN で次の試行の公開鍵の artifact を先に置けるため、
      # 発行 job が攻撃者の公開鍵で暗号化してしまう（参照: PROJECT.md「リポジトリ公開に耐える安全性」の 11）
      - name: re-run では発行しない
        if: github.run_attempt != '1'
        run: |
          echo "::error::re-run では Tailscale の auth key を発行しない。workflow_dispatch で新しい run を起動する（local/webtunnel up）"
          exit 1

      # caller リポジトリは checkout しない。runner スクリプトは session job と同じく
      # この workflow ファイルと同一 repo・同一 commit から取得する
      - name: webtunnel（runner スクリプト）を checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      # artifact の到着を待つ API は actions: read の権限が要り、caller workflow の permissions の変更が要るため使わない。
      # 取得を試す step を間隔を置いて繰り返し、取得できた後の step は飛ばす。
      # 待ちは最長 30 秒 × 20 回 = 10 分（session job の runner の割り当てが遅れる分を覆う）。
      # session job が公開鍵を上げる前に失敗した時は、同じ名前の artifact で中止の印（session-aborted）が届き、
      # 待ちを抜けて mint-tailscale-auth-key.sh が失敗する（run が待ちの間 concurrency group を握り続けないように）
      - &download-session-public-key
        name: session job の公開鍵を受け取る
        if: hashFiles('webtunnel-handoff/*') == ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webtunnel-session-public-key-${{ inputs.session }}-${{ github.run_attempt }}
          path: webtunnel-handoff
      - &wait-session-public-key
        name: session job の公開鍵を待つ
        if: hashFiles('webtunnel-handoff/*') == ''
        run: sleep 30
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key
      - *wait-session-public-key
      - *download-session-public-key

      - name: Tailscale の auth key を発行
        env:
          TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
          TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
          SESSION_PUBLIC_KEY_FILE: webtunnel-handoff/session-public-key.pem
          ENCRYPTED_AUTH_KEY_FILE: webtunnel-handoff/out/encrypted-auth-key.bin
        run: ./runner/mint-tailscale-auth-key.sh

      # 暗号文は session job の秘密鍵でしか復号できないため、public な artifact に置いてよい
      - name: 暗号化した auth key を session job へ渡す
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webtunnel-encrypted-auth-key-${{ inputs.session }}-${{ github.run_attempt }}
          path: webtunnel-handoff/out/encrypted-auth-key.bin
          # session job が受け取った後は使わない。最短の 1 日にする
          retention-days: 1
          if-no-files-found: error

  session:
    runs-on: ubuntu-latest
    # 各 step が個別に時間制限を持つため、これは暴走時の最終防衛線
    timeout-minutes: 360
    # caller のコードを実行する job のため、OIDC トークンの発行能力（id-token）を持たせない
    permissions:
      contents: read
    steps:
      # 後続 step の START_URL は GITHUB_ENV 経由で渡す（start-chromium.sh が読む env 名）
      - name: 入力を検証して開く URL を決める
        env:
          SESSION: ${{ inputs.session }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          START_URL: ${{ inputs.start_url }}
          START_COMMAND: ${{ inputs.start_command }}
          PORT: ${{ inputs.port }}
          SOFTWARE_WEBGL: ${{ inputs.software_webgl }}
        run: |
          [[ "$SESSION" =~ ^[a-z0-9-]+$ ]] || {
            echo "session は小文字英数字とハイフンのみ許可: $SESSION" >&2
            exit 1
          }
          # 表記ゆれ（True / yes 等）を黙って「無効」に倒すと WebGL2 が要るセッションを誤検証するため、ここで落とす
          [ "$SOFTWARE_WEBGL" = "true" ] || [ "$SOFTWARE_WEBGL" = "false" ] || {
            echo "software_webgl は true / false のみ許可: $SOFTWARE_WEBGL" >&2
            exit 1
          }
          [[ "$PORT" =~ ^[0-9]+$ ]] && [ "$PORT" -ge 1 ] && [ "$PORT" -le 65535 ] || {
            echo "port は 1〜65535 の整数: $PORT" >&2
            exit 1
          }
          # CDP と同じポートだと start-chromium.sh の CDP 応答待ちが dev サーバの応答を CDP と誤認し、
          # preview と同じポートだと start-preview.sh の冪等チェックが dev サーバを preview と誤認する
          [ "$PORT" != "$CDP_PORT" ] && [ "$PORT" != "$PREVIEW_PORT" ] || {
            echo "port は CDP (${CDP_PORT}) / preview (${PREVIEW_PORT}) のポートと別にする" >&2
            exit 1
          }
          # 空だと webtunnel の checkout がデフォルトブランチに落ちて workflow と scripts の版がずれる
          [ -n "$JOB_WORKFLOW_SHA" ] || {
            echo "job.workflow_sha が空。runner スクリプトの版を固定できないため中断" >&2
            exit 1
          }
          # ホスト名に run id を含めるのは、CLI が自分の dispatch した run のノードだけを接続先にするため
          # （参照: PROJECT.md「接続先ノードの検証」）。DNS ラベルの上限 63 文字を超えると CLI が照合できない
          TS_HOSTNAME="webtunnel-${SESSION}-${GITHUB_RUN_ID}"
          [ "${#TS_HOSTNAME}" -le 63 ] || {
            echo "tailnet ホスト名 ${TS_HOSTNAME} が 63 文字を超える。session を短くする" >&2
            exit 1
          }
          if [ -z "$START_URL" ] && [ -n "$START_COMMAND" ]; then
            START_URL="http://localhost:${PORT}/"
          fi
          {
            echo "START_URL=${START_URL:-about:blank}"
            echo "TS_HOSTNAME=${TS_HOSTNAME}"
          } >> "$GITHUB_ENV"

      # タグは可変で差し替えられうるため commit SHA で固定する（参照: PROJECT.md「リポジトリ公開に耐える安全性」）
      # checkout 後に git 認証は使わないため token を .git/config に残さない
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # checkout はパス先の既存内容を消すため、万一 caller リポジトリが同名ディレクトリを持つ場合は
      # 黙って上書きせず、ここで明確に失敗させる
      # tailscale-auth-key job は re-run では発行しないため、待たずに止める
      - name: re-run では始めない
        if: github.run_attempt != '1'
        run: |
          echo "::error::re-run では Tailscale の auth key を受け取れない。workflow_dispatch で新しい run を起動する（local/webtunnel up）"
          exit 1

      - name: runner スクリプトの checkout 先が空いていることを確認
        run: |
          [ ! -e .webtunnel-runner ] || {
            echo "caller リポジトリのルートに .webtunnel-runner が存在するため、runner スクリプトを配置できない" >&2
            exit 1
          }

      # runner スクリプトは caller リポジトリには無いため、この workflow ファイルと同一 repo・同一 commit を取得する
      # （job.workflow_sha / job.workflow_repository は reusable workflow では呼ばれた workflow ファイルを指す）。
      # caller リポジトリのディレクトリと衝突しにくい dot 付きのパスに置く
      - name: webtunnel（runner スクリプト）を checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .webtunnel-runner
          persist-credentials: false

      # tailscale-auth-key job から auth key を受け取るための run ごとの鍵ペア。caller のコードを実行する
      # step（Node のセットアップ以降）より前に作る（参照: PROJECT.md「リポジトリ公開に耐える安全性」の 11）
      - name: auth key を受け取る鍵ペアを作る
        env:
          SESSION_PRIVATE_KEY_FILE: ${{ runner.temp }}/webtunnel-session-private-key.pem
          SESSION_PUBLIC_KEY_FILE: .webtunnel-runner/handoff/session-public-key.pem
        run: ./.webtunnel-runner/runner/create-session-key-pair.sh

      - name: 公開鍵を tailscale-auth-key job へ渡す
        id: upload-session-public-key
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webtunnel-session-public-key-${{ inputs.session }}-${{ github.run_attempt }}
          path: .webtunnel-runner/handoff/session-public-key.pem
          # tailscale-auth-key job が受け取った後は使わない。最短の 1 日にする
          retention-days: 1
          if-no-files-found: error

      # reusable workflow の呼び出しは job 単位で caller が step を差し込めないため、
      # dev サーバのツールチェーン準備はこの workflow 側で受け持つ（参照: PROJECT.md「dev サーバの起動」）
      - name: Node をセットアップ
        if: inputs.node_version != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}

      # Chromium より先に起動して、start_url でそのまま dev サーバを開けるようにする。
      # dev サーバを起動しない（拡張だけを読み込む）セッションでも、拡張のビルドは
      # setup_command が担うため、setup_command だけが指定された場合も実行する
      - name: セットアップと dev サーバを起動
        if: inputs.start_command != '' || inputs.setup_command != ''
        timeout-minutes: 15
        env:
          SETUP_COMMAND: ${{ inputs.setup_command }}
          START_COMMAND: ${{ inputs.start_command }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          PORT: ${{ inputs.port }}
          READY_PATH: ${{ inputs.ready_path }}
        run: ./.webtunnel-runner/runner/start-dev-server.sh

      - name: Chromium を起動
        timeout-minutes: 10
        env:
          EXTENSION_PATH: ${{ inputs.extension_path }}
          SOFTWARE_WEBGL: ${{ inputs.software_webgl }}
        run: ./.webtunnel-runner/runner/start-chromium.sh

      # 録画開始・tailnet 参加より前に置く。ログイン操作を録画に写さないための順序であり、
      # 入れ替えると認証情報が artifact に残りうる（参照: PROJECT.md「ログイン済み状態でのセッション開始」）
      # timeout-minutes はスクリプト内のタイムアウト（既定 180 + 480 秒）より長くする。
      # step が先に殺されると以降の step が飛び、「セットアップが失敗してもセッションは開く」が崩れる
      - name: セッションを初期化
        timeout-minutes: 15
        env:
          SETUP_SCRIPT: ${{ inputs.setup_script }}
          WEBTUNNEL_AUTH_ENV: ${{ secrets.WEBTUNNEL_AUTH_ENV }}
        run: ./.webtunnel-runner/runner/run-auth-setup.sh

      - name: 録画を開始
        if: inputs.record == 'true'
        timeout-minutes: 5
        run: ./.webtunnel-runner/runner/start-recording.sh

      - name: preview を開始
        if: inputs.preview == 'true'
        timeout-minutes: 5
        run: ./.webtunnel-runner/runner/start-preview.sh

      # tailscale-auth-key job の待ちと同じ方式で受け取る。ここに来るのは通常、公開鍵を渡してから数分後で
      # 暗号文は届いている。届いていない時の待ちは、tailscale-auth-key job の runner の割り当ての遅れを覆うよう、
      # 公開鍵の待ちと同じ最長 10 分（15 秒 × 40 回）にする。
      # artifact 名に試行番号を含めるため、session job だけを再実行した試行では届かず、復号の step が再実行の仕方を案内して止まる
      - &download-encrypted-auth-key
        name: 暗号化した auth key を受け取る
        if: hashFiles('.webtunnel-runner/handoff/encrypted-auth-key.bin') == ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webtunnel-encrypted-auth-key-${{ inputs.session }}-${{ github.run_attempt }}
          path: .webtunnel-runner/handoff
      - &wait-encrypted-auth-key
        name: 暗号化した auth key を待つ
        if: hashFiles('.webtunnel-runner/handoff/encrypted-auth-key.bin') == ''
        run: sleep 15
      - *download-encrypted-auth-key
      - *wait-encrypted-auth-key
      - *download-encrypted-auth-key
      - *wait-encrypted-auth-key
      - *download-encrypted-auth-key

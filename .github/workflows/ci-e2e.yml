# managed-by: setup-ci (bannzai/castle)
name: ブラウザ E2E

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Ubuntu 24.04 の AppArmor 制限では、取得した Chromium の user namespace sandbox が起動できない。
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: テスト用 Chromium をインストールする
        run: npx --yes playwright@1.63.0 install chromium --only-shell --with-deps
      - name: ブラウザ操作を検証する
        run: bash skills/webtunnel/scripts/test/test-godot-web.sh

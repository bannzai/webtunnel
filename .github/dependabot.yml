# Managed by setup-dependabot skill ( https://github.com/bannzai/castle )
# 再実行するとファイル全体が再生成される。手動管理に切り替える場合はこのヘッダーを削除する。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/webProject"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webtunnel サンプルアプリ</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>webtunnel 動作確認用サンプル 🚀</h1>
      <p class="lead">
        agent-browser からの操作と、日本語が豆腐（□）にならないことをこの 1 ページで確認する。
      </p>

      <section>
        <h2>クリックで表示が変わる</h2>
        <button id="counter-button" type="button">カウントする</button>
        <p>これまで <output id="counter-value">0</output> 回クリックした</p>
      </section>

      <section>
        <h2>フォーム入力</h2>
        <form id="greeting-form">
          <label for="greeting-input">お名前</label>
          <input id="greeting-input" name="name" type="text" placeholder="山田 太郎" />
          <button id="greeting-submit" type="submit">あいさつする</button>
        </form>
        <p id="greeting-output">名前を入力してあいさつすると、ここに表示される</p>
      </section>

      <section>
        <h2>非同期に更新される要素</h2>
        <p id="async-status">読み込み中…</p>
        <ul id="async-items"></ul>
        <p>ページを開いてから <output id="elapsed-seconds">0</output> 秒経過</p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
